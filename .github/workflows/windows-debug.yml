name: Windows Debug

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Debug presets
        run: |
          $presets = Get-Content CMakePresets.json -Raw | ConvertFrom-Json
          $configure = $presets.configurePresets | Where-Object name -eq windows-x64-tests
          $build = $presets.buildPresets | Where-Object name -eq debug-tests-x64
          $test = $presets.testPresets | Where-Object name -eq debug-tests-x64
          if ($configure.architecture -ne 'x64' -or
              $configure.cacheVariables.CMAKE_CONFIGURATION_TYPES -ne 'Debug' -or
              $configure.cacheVariables.BUILD_TESTING -ne 'ON' -or
              $build.configurePreset -ne 'windows-x64-tests' -or
              $test.configurePreset -ne 'windows-x64-tests' -or
              $build.configuration -ne 'Debug' -or $test.configuration -ne 'Debug') {
            throw 'CI requires x64 and Debug only'
          }
      - name: Configure Debug x64
        run: cmake --preset windows-x64-tests
      - name: Build Debug x64
        run: cmake --build --preset debug-tests-x64
      - name: Run offline Debug CTest
        run: ctest --preset debug-tests-x64 --no-tests=error
